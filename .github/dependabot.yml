version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /web
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - react
          - react-dom
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
